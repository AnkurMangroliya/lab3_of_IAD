{% extends 'myapp/base.html' %}

{% block body_block %}
    <h2>Submit a Review</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit Review">
    </form>
{% endblock %}
