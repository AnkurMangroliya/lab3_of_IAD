<!-- myapp/templates/myapp/review.html -->
{% extends 'myapp/base.html' %}

{% block body_block %}
    <h2>Submit a Review</h2>
    <form method="post" action="{% url 'myapp:review' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Review</button>
    </form>
{% endblock %}
