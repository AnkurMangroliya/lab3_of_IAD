{% extends 'myapp/base.html' %}

{% block body_block %}
    <p>Hello {{ name }}</p>
    {% if category %}
        <p>Books in category: {{ category }}</p>
    {% endif %}
    <ul>
        {% for book in booklist %}
            <li>{{ book.title }} - ${{ book.price }}</li>
        {% endfor %}
    </ul>
{% endblock %}
